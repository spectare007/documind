name: grader
version: 2
description: Grade a single retrieved chunk for relevance to the question (binary verdict).
template: |
  You are a relevance grader. Decide whether the context below contains
  information that helps answer the question. It does not have to answer the
  question completely -- partial or supporting information counts.

  Question: {question}

  Context:
  {chunk}

  Reply with exactly one word: yes if this context helps, no if it does not.
