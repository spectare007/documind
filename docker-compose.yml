services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pinned to the version running at the time this pin was written (verified
  # against the live container: `ollama --version` -> 0.32.13), not `latest`,
  # so the stack can't break on an unannounced upstream release.
  # ollama/ollama:0.32.13 == sha256:77f1a2a54460f0380f2611e1464233d9b82cb6e58afc8f60abec0061049d2d82
  ollama:
    image: ollama/ollama:0.32.13
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.32.13
    depends_on:
      ollama: {condition: service_healthy}
    environment: {OLLAMA_HOST: "http://ollama:11434"}
    entrypoint: >
      sh -c "ollama pull qwen2.5:3b &&
             ollama pull nomic-embed-text &&
             ollama pull qwen2.5:7b"
    restart: "no"

  # Pinned to the version running at the time this pin was written (verified
  # against the live container: `phoenix.__version__` -> 20.2.1), not `latest`.
  # arizephoenix/phoenix:version-20.2.1 == sha256:5ae3c414e8ee7ee47caa022edf8e94bdef7a90634a4e914a99dbe9d1f70790b8
  phoenix:
    image: arizephoenix/phoenix:version-20.2.1
    ports: ["6006:6006", "4317:4317"]
    volumes: [phoenix_data:/mnt/data]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DOCUMIND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind}@postgres:5432/${POSTGRES_DB:-documind}
      DOCUMIND_OLLAMA_BASE_URL: http://ollama:11434
      DOCUMIND_PHOENIX_BASE_URL: http://phoenix:6006
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
      - hf_cache:/root/.cache
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}

  # Pinned by digest, not tag: the running container was built from `main`
  # (no released version tag matches this exact build; the closest release,
  # per its own package.json, is the not-yet-tagged 0.11.0), so the digest is
  # the only reproducible reference. Re-verify with
  # `docker inspect ghcr.io/open-webui/open-webui:main --format '{{.RepoDigests}}'`
  # against a running container before bumping.
  openwebui:
    image: ghcr.io/open-webui/open-webui@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
    ports: ["3000:8080"]
    environment:
      OPENAI_API_BASE_URL: http://backend:8000/v1
      OPENAI_API_KEY: ${DOCUMIND_API_KEY:-documind-dev-key}
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"
    volumes: [openwebui_data:/app/backend/data]
    depends_on: [backend]

volumes:
  pgdata:
  ollama_data:
  phoenix_data:
  hf_cache:
  openwebui_data:
